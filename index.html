<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="The Weight of Attention — a generative artwork about selective attention."
    />
    <title>The Weight of Attention</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main
      class="artwork"
      aria-label="The Weight of Attention, a passive generative field of drifting typographic and geometric marks."
    >
      <canvas id="field" aria-hidden="true">
        A quiet field of drifting characters, symbols, and dots.
      </canvas>

      <header class="editorial editorial--header">
        <p class="editorial__label">GENERATIVE STUDY / 001</p>
        <h1 class="editorial__title">THE WEIGHT OF ATTENTION</h1>
        <p class="editorial__statement">TO FOCUS IS ALSO TO EXCLUDE.</p>
      </header>

      <p class="editorial editorial--instruction">
        MOVE SLOWLY. STAY FOR A MOMENT.
      </p>
      <p class="editorial editorial--mode">FOCUS / PERIPHERY</p>
    </main>
  </body>
</html>
